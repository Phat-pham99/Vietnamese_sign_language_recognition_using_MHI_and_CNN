[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vsl-mhi-cnn"
version = "1.0.0"
description = "Vietnamese sign language recognition using Motion History Images and a lightweight 2D-CNN"
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [{ name = "Phạm Hồng Phát" }]
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "Pillow>=10.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "scikit-learn>=1.3",
    "PyYAML>=6.0",
    "tensorflow>=2.16,<3",
]

[project.optional-dependencies]
dev = ["ruff==0.17.5"]

[tool.setuptools]
packages = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
